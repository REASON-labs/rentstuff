<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>(function(){try{var t=localStorage.getItem('rs-theme');if(t){document.documentElement.setAttribute('data-theme',t);}}catch(e){}})();</script>
  <title>{% block title %}RentStuff{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/rentstuff.css') }}">
</head>
<body>
  <div class="page">
    <header class="mast">
      <a class="brand" href="{{ url_for('public.index') }}">Rent<span class="st">Stuff</span></a>
      <nav class="meta-nav">
        <a href="{{ url_for('public.index') }}">gear</a>
        <a href="{{ url_for('admin.dashboard') }}">admin</a>
        {% if session.get('is_admin') %}<a href="{{ url_for('auth.logout') }}">logout</a>{% endif %}
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle light or dark theme">theme</button>
      </nav>
    </header>
    <div class="hazard"></div>

    {% with messages = get_flashed_messages() %}
      {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
    {% endwith %}

    {% block body %}{% endblock %}

    <div class="foot">
      <span>RentStuff</span>
      <span>reserve &rarr; pick up &rarr; return &middot; deposit back on return</span>
    </div>
  </div>
  <script>
  (function(){
    var btn = document.getElementById('theme-toggle');
    if(!btn) return;
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    function effective(){
      var t = document.documentElement.getAttribute('data-theme');
      return t ? t : (mq.matches ? 'dark' : 'light');
    }
    function render(){ btn.textContent = effective() === 'dark' ? 'light mode' : 'dark mode'; }
    render();
    btn.addEventListener('click', function(){
      var next = effective() === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('rs-theme', next); } catch(e){}
      render();
    });
    mq.addEventListener('change', function(){
      try { if(!localStorage.getItem('rs-theme')) render(); } catch(e){}
    });
  })();
  </script>
</body>
</html>
