{% extends "base.html" %}
{% block title %}items &mdash; RentStuff{% endblock %}
{% block body %}
  <h1 class="title"><span class="st">//</span> items</h1>
  <a class="btn" href="{{ url_for('admin.item_new') }}">+ new item</a>
  <div class="panel" style="margin-top:1rem">
    <table>
      <tr><th>name</th><th>rate</th><th>active</th><th></th></tr>
      {% for i in items %}
        <tr>
          <td>{{ i['name'] }}</td>
          <td>{{ '%g'|format(i['rate_amount']) }} / {{ i['rate_unit'] }}</td>
          <td>{{ 'yes' if i['is_active'] else 'no' }}</td>
          <td>
            <form class="inline-form" method="post" action="{{ url_for('admin.item_toggle', item_id=i['id']) }}">
              <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
              <button class="btn ghost">{{ 'hide' if i['is_active'] else 'show' }}</button>
            </form>
          </td>
        </tr>
      {% endfor %}
    </table>
  </div>
{% endblock %}
