{% extends "base.html" %}
{% block title %}new item &mdash; RentStuff{% endblock %}
{% block body %}
  <h1 class="title"><span class="st">//</span> new item</h1>
  <form method="post" class="panel" enctype="multipart/form-data" style="max-width:560px">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field"><label>name</label><input name="name" value="{{ form.get('name','') }}" required></div>
    <div class="field"><label>description</label><textarea name="description" rows="2">{{ form.get('description','') }}</textarea></div>
    <div class="two">
      <div class="field"><label>rate amount</label><input name="rate_amount" type="number" step="0.01" value="{{ form.get('rate_amount','') }}"></div>
      <div class="field"><label>rate unit</label>
        <select name="rate_unit"><option value="day">day</option><option value="week">week</option><option value="flat">flat</option></select>
      </div>
    </div>
    <div class="field"><label>deposit amount</label><input name="deposit_amount" type="number" step="0.01" value="{{ form.get('deposit_amount','') }}"></div>

    <div class="field">
      <label>image</label>
      <p class="img-help">Upload a photo, or pick a default below. Leave both blank to use the item's icon.</p>
      <input type="file" name="photo" accept="image/*">
      <div class="defaults">
        {% for d in defaults %}
          <label class="def-tile">
            <input type="radio" name="default_image" value="{{ d }}">
            <img src="{{ url_for('static', filename=d) }}" alt="default option">
          </label>
        {% endfor %}
      </div>
    </div>

    <button class="btn" type="submit">Save item</button>
  </form>
{% endblock %}
