{% extends "base.html" %}
{% block title %}add booking &mdash; RentStuff{% endblock %}
{% block body %}
  <h1 class="title"><span class="st">//</span> add booking</h1>
  <form method="post" class="panel" style="max-width:560px">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field"><label>item</label>
      <select name="item_id" required>
        <option value="">— pick an item —</option>
        {% for i in items %}
          <option value="{{ i['id'] }}" {% if form.get('item_id')|string==i['id']|string %}selected{% endif %}>{{ i['name'] }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="field"><label>renter name</label><input name="renter_name" value="{{ form.get('renter_name','') }}" required></div>
    <div class="two">
      <div class="field"><label>renter email</label><input name="renter_email" type="email" value="{{ form.get('renter_email','') }}"></div>
      <div class="field"><label>renter contact</label><input name="renter_contact" value="{{ form.get('renter_contact','') }}"></div>
    </div>
    <div class="two">
      <div class="field"><label>pickup date</label><input type="date" name="start_date" value="{{ form.get('start_date','') }}" required></div>
      <div class="field"><label>return date</label><input type="date" name="end_date" value="{{ form.get('end_date','') }}" required></div>
    </div>
    <div class="two">
      <div class="field"><label>status</label>
        <select name="status">
          {% for st in ['confirmed','requested','returned','cancelled'] %}
            <option value="{{ st }}" {% if form.get('status','confirmed')==st %}selected{% endif %}>{{ st }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="field"><label>amount (blank = auto from rate)</label><input name="quoted_amount" type="number" step="0.01" value="{{ form.get('quoted_amount','') }}"></div>
    </div>
    <div class="field"><label>notes</label><textarea name="notes" rows="2">{{ form.get('notes','') }}</textarea></div>
    <button class="btn" type="submit">Add booking</button>
  </form>
{% endblock %}
