services:
  rentstuff:
    build: .
    env_file: .env
    volumes:
      - rentstuff-data:/data
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rentstuff.rule=Host(`rentstuff.jaybb.com`)"
      - "traefik.http.routers.rentstuff.entrypoints=websecure"
      - "traefik.http.routers.rentstuff.tls.certresolver=letsencrypt"
      - "traefik.http.services.rentstuff.loadbalancer.server.port=8000"

volumes:
  rentstuff-data:

networks:
  proxy:
    external: true
